        <title>EXAMPLE 1</title>

                        "objects": {

                        }
                    }
                },
                
                Translations: {
                    ru: {
                        "objects": "Объекты",
                        "test": "ТЕСТ, ЭТО РУССКАЯ СТРОКА!!!"
                    },
                    en: {
                        "objects": "TEST",

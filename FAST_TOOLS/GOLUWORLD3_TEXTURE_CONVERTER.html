<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GOLUWorld-3 TEXTURE TERMINAL (DEBUG EDITION)</title>
    <style>
        :root {
            --neon-red: #ff003c;
            --dark-red: #4d0012;
            --bg-color: #0a0000;
            --glow: 0 0 10px rgba(255, 0, 60, 0.7), 0 0 20px rgba(255, 0, 60, 0.4);
            --glitch-border: 2px solid var(--neon-red);
        }

        body {
            background-color: var(--bg-color);
            color: #ffb3b3;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 20px; overflow-x: hidden; text-transform: uppercase;
        }

        h1 { color: var(--neon-red); text-align: center; text-shadow: var(--glow); letter-spacing: 5px; margin-bottom: 20px; }

        .main-wrapper { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 3; }

        .panel {
            flex: 1; background: rgba(20, 0, 0, 0.8); border: var(--glitch-border);
            padding: 20px; box-shadow: inset 0 0 15px rgba(255, 0, 60, 0.2);
            display: flex; flex-direction: column;
        }

        h2 { color: var(--neon-red); font-size: 1.1em; border-bottom: 1px solid var(--neon-red); padding-bottom: 10px; margin-top: 0; }

        textarea {
            width: 100%; height: 100px; background: #1a0004; color: #ff4d6a; border: 1px solid var(--dark-red);
            padding: 10px; box-sizing: border-box; font-family: monospace; resize: none; outline: none; margin-bottom: 10px;
        }

        .canvas-container {
            background-color: #050000;
            background-image: 
                linear-gradient(45deg, #1a0000 25%, transparent 25%), 
                linear-gradient(-45deg, #1a0000 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1a0000 75%), 
                linear-gradient(-45deg, transparent 75%, #1a0000 75%);
            background-size: 10px 10px; border: 1px solid var(--neon-red);
            margin: 10px auto; display: flex; align-items: center; justify-content: center;
            min-height: 120px; width: 100%;
        }

        canvas { image-rendering: pixelated; max-width: 100%; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; font-size: 0.75em; color: #ff8095; }
        .info-item span { color: var(--neon-red); font-weight: bold; }

        /* Таблица палитры */
        .palette-view {
            display: flex; flex-wrap: wrap; gap: 4px; padding: 10px;
            background: #110002; border: 1px solid var(--dark-red); margin-top: 10px;
            max-height: 100px; overflow-y: auto;
        }
        .color-swatch {
            width: 16px; height: 16px; border: 1px solid #ffb3b3;
            position: relative; cursor: crosshair;
        }
        .color-swatch:hover::after {
            content: attr(title); position: absolute; top: 0; left: 20px;
            background: #000; color: #fff; font-size: 8px; padding: 2px; z-index: 20; white-space: nowrap;
        }

        .button-group { display: flex; gap: 10px; }
        button {
            background: var(--neon-red); color: #000; border: none; padding: 12px; flex: 1;
            font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        button:hover { background: #fff; box-shadow: var(--glow); }
        button.secondary { background: #4d0012; color: var(--neon-red); border: 1px solid var(--neon-red); }

        .file-label {
            display: block; padding: 10px; border: 1px dashed var(--neon-red);
            text-align: center; cursor: pointer; margin-bottom: 10px; background: rgba(255, 0, 60, 0.05);
        }
    </style>
</head>
<body>

    <h1>GOLUWorld-3 TEXTURE TERMINAL</h1>

    <div class="main-wrapper">
        <div class="panel">
            <h2>INPUT [PNG/CAPTURE]</h2>
            <label class="file-label" for="fileInput">PNG / CTRL+V</label>
            <input type="file" id="fileInput" accept="image/png" style="display:none">

            <div class="canvas-container"><canvas id="prevEncode"></canvas></div>

            <div class="info-grid">
                <div class="info-item">SIZE: <span id="infoSize">-</span></div>
                <div class="info-item">ALPHA: <span id="infoAlpha">-</span></div>
                <div class="info-item">GRAY: <span id="infoGray">-</span></div>
				<div class="info-item">FLAGS: <span id="infoFlag">-</span></div>
                <div class="info-item">COLORS: <span id="infoColors">-</span></div>
                <div class="info-item" style="grid-column: span 2;">STR LEN: <span id="infoLen">0</span></div>
            </div>

            <div id="paletteContainer" class="palette-view"></div>

            <textarea id="outputText" readonly placeholder="DATA..."></textarea>
            <button onclick="copyToClipboard('outputText', 'copyBtn')" id="copyBtn">COPY CODE</button>
        </div>

        <div class="panel">
            <h2>OUTPUT [REVERSE]</h2>
            <textarea id="inputText" placeholder="PASTE CODE..."></textarea>
            <div class="canvas-container"><canvas id="prevDecode"></canvas></div>
            <div class="info-grid">
                <div class="info-item">WIDTH: <span id="decW">-</span></div>
                <div class="info-item">HEIGHT: <span id="decH">-</span></div>
            </div>
            <div class="button-group">
                <button onclick="copyImageToClipboard()" id="copyImgBtn">COPY PNG</button>
                <button class="secondary" onclick="clearAll()">CLEAR</button>
            </div>
        </div>
    </div>

<script>
    const OFFSET = 0x4E00;
    const fileInput = document.getElementById('fileInput');
    const inputText = document.getElementById('inputText');
    const outText = document.getElementById('outputText');
    const encodeCanvas = document.getElementById('prevEncode');
    const decodeCanvas = document.getElementById('prevDecode');
    const paletteContainer = document.getElementById('paletteContainer');

    function clearAll() {
        fileInput.value = ""; inputText.value = ""; outText.value = "";
        encodeCanvas.width = 0; decodeCanvas.width = 0;
        paletteContainer.innerHTML = "";
        document.querySelectorAll('.info-item span').forEach(s => s.innerText = "-");
    }
	clearAll()

    function bytesToCompact(bytes) {
        let str = ""; let buffer = 0; let bits = 0;
        for (let i = 0; i < bytes.length; i++) {
            buffer = (buffer << 8) | bytes[i];
            bits += 8;
            while (bits >= 12) {
                bits -= 12;
                str += String.fromCharCode(OFFSET + (buffer >> bits));
                buffer &= (1 << bits) - 1;
            }
        }
        if (bits > 0) str += String.fromCharCode(OFFSET + (buffer << (12 - bits)));
        return str;
    }

    function compactToBytes(str) {
        let bytes = []; let buffer = 0; let bits = 0;
        for (let i = 0; i < str.length; i++) {
            let val = str.charCodeAt(i) - OFFSET;
            buffer = (buffer << 12) | val;
            bits += 12;
            while (bits >= 8) { bits -= 8; bytes.push((buffer >> bits) & 0xFF); }
        }
        return new Uint8Array(bytes);
    }

    window.addEventListener('paste', e => {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) { handleImage(items[i].getAsFile()); return; }
            if (items[i].type === 'text/plain') {
                items[i].getAsString(text => {
                    if (text.includes('|')) { inputText.value = text.trim(); inputText.dispatchEvent(new Event('input')); }
                });
            }
        }
    });

    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleImage(e.target.files[0]); });

    function handleImage(file) {
        const img = new Image();
        img.onload = function() {
            const w = img.width, h = img.height;
            encodeCanvas.width = w; encodeCanvas.height = h;
            const ctx = encodeCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const data = ctx.getImageData(0, 0, w, h).data;

            let palette = []; let colorMap = new Map(); let pixels = [];
            let hasR = false, hasG = false, hasB = false, hasA = false, isGray = true;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (r > 0) hasR = true; if (g > 0) hasG = true; if (b > 0) hasB = true; if (a < 255) hasA = true;
                if (r !== g || g !== b) isGray = false;

                let rgbaKey = `${r},${g},${b},${a}`;
                if (!colorMap.has(rgbaKey)) {
                    colorMap.set(rgbaKey, palette.length);
                    palette.push([r, g, b, a]);
                }
                pixels.push(colorMap.get(rgbaKey));
            }

            // Маска флагов: 1-R, 2-G, 4-B, 8-A, 16-Gray
            let flags = 0;
            if (isGray) {
                flags |= 16;
                if (hasA) flags |= 8;
            } else {
                if (hasR) flags |= 1;
                if (hasG) flags |= 2;
                if (hasB) flags |= 4;
                if (hasA) flags |= 8;
            }

            // UI Debug
            paletteContainer.innerHTML = "";
            palette.forEach(c => {
                let div = document.createElement('div'); div.className = 'color-swatch';
                div.style.backgroundColor = `rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`;
                paletteContainer.appendChild(div);
            });

            let bpp = palette.length <= 2 ? 1 : (palette.length <= 4 ? 2 : (palette.length <= 16 ? 4 : 8));
            let buffer = [palette.length];
            
            // Пишем в палитру только те каналы, что в флагах
            palette.forEach(c => {
                if (isGray) {
                    buffer.push(c[0]); // Только R
                    if (hasA) buffer.push(c[3]); // И Alpha
                } else {
                    if (hasR) buffer.push(c[0]);
                    if (hasG) buffer.push(c[1]);
                    if (hasB) buffer.push(c[2]);
                    if (hasA) buffer.push(c[3]);
                }
            });

            buffer.push(bpp);
            let currentByte = 0; let bitCount = 0;
            pixels.forEach(idx => {
                currentByte = (currentByte << bpp) | idx;
                bitCount += bpp;
                while (bitCount >= 8) {
                    bitCount -= 8;
                    buffer.push((currentByte >> bitCount) & 0xFF);
                }
            });
            if (bitCount > 0) buffer.push((currentByte << (8 - bitCount)) & 0xFF);

            const finalStr = `${w}|${flags}|${bytesToCompact(new Uint8Array(buffer))}`;
            outText.value = finalStr;

            document.getElementById('infoSize').innerText = `${w}x${h}`;
            document.getElementById('infoAlpha').innerText = hasA ? "YES" : "NO";
            document.getElementById('infoGray').innerText = isGray ? "YES" : "NO";
            document.getElementById('infoColors').innerText = palette.length;
            document.getElementById('infoFlag').innerText = flags;
            document.getElementById('infoLen').innerText = finalStr.length;
        };
        img.src = URL.createObjectURL(file);
    }

    inputText.addEventListener('input', function() {
        const parts = this.value.trim().split('|');
        if (parts.length < 3) return;
        const w = parseInt(parts[0]), flags = parseInt(parts[1]);
        const buffer = compactToBytes(parts[2]);

        let ptr = 0;
        const colorsCount = buffer[ptr++];
        const palette = [];
        const isGray = (flags & 16) !== 0;
        const hasR = (flags & 1) !== 0, hasG = (flags & 2) !== 0, hasB = (flags & 4) !== 0, hasA = (flags & 8) !== 0;

        for (let i = 0; i < colorsCount; i++) {
            let r=0, g=0, b=0, a=255;
            if (isGray) {
                r = g = b = buffer[ptr++];
                if (hasA) a = buffer[ptr++];
            } else {
                if (hasR) r = buffer[ptr++];
                if (hasG) g = buffer[ptr++];
                if (hasB) b = buffer[ptr++];
                if (hasA) a = buffer[ptr++];
            }
            palette.push([r, g, b, a]);
        }
        
        const bpp = buffer[ptr++];
        const h = Math.floor(((buffer.length - ptr) * 8 / bpp) / w);
        decodeCanvas.width = w; decodeCanvas.height = h;
        const ctx = decodeCanvas.getContext('2d');
        const imgData = ctx.createImageData(w, h);
        
        let pixelIdx = 0; let currentByte = 0; let bitCount = 0;
        while (pixelIdx < w * h) {
            if (bitCount === 0) { currentByte = buffer[ptr++]; bitCount = 8; }
            const idx = (currentByte >> (bitCount - bpp)) & ((1 << bpp) - 1);
            const color = palette[idx] || [0,0,0,0];
            imgData.data[pixelIdx * 4] = color[0];
            imgData.data[pixelIdx * 4 + 1] = color[1];
            imgData.data[pixelIdx * 4 + 2] = color[2];
            imgData.data[pixelIdx * 4 + 3] = color[3];
            pixelIdx++; bitCount -= bpp;
        }
        ctx.putImageData(imgData, 0, 0);
        document.getElementById('decW').innerText = w; document.getElementById('decH').innerText = h;
    });

    function copyToClipboard(elementId, btnId) {
        const el = document.getElementById(elementId);
        el.select(); document.execCommand('copy');
    }

    async function copyImageToClipboard() {
        const blob = await new Promise(res => decodeCanvas.toBlob(res));
        await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
    }
</script>
</body>
</html>

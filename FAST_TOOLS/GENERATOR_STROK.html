<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор строк</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 800px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 20px 0;
    color: #89b4fa;
  }

  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #a6adc8;
  }

  .field {
    margin-bottom: 16px;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 8px;
    color: #cdd6f4;
    outline: none;
    transition: border-color .15s;
  }

  input:focus {
    border-color: #89b4fa;
  }

  .row {
    display: flex;
    gap: 12px;
  }

  .row .field {
    flex: 1;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    background: #89b4fa;
    color: #1e1e2e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    margin-top: 4px;
  }

  button:hover {
    background: #74a8f0;
  }

  button:active {
    background: #5c93dd;
  }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 0 8px;
  }

  .output-header span {
    font-size: 14px;
    color: #a6adc8;
  }

  .copy-btn {
    width: auto;
    padding: 6px 14px;
    font-size: 13px;
    margin: 0;
    background: #45475a;
    color: #cdd6f4;
  }

  .copy-btn:hover {
    background: #585b70;
  }

  .copy-btn:active {
    background: #6c7086;
  }

  textarea {
    width: 100%;
    min-height: 300px;
    padding: 12px;
    font-size: 14px;
    font-family: "Consolas", "Monaco", monospace;
    background: #181825;
    border: 1px solid #45475a;
    border-radius: 8px;
    color: #a6e3a1;
    outline: none;
    resize: vertical;
    line-height: 1.5;
  }

  textarea:focus {
    border-color: #89b4fa;
  }

  .hint {
    font-size: 12px;
    color: #6c7086;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Генератор строк по шаблону</h1>

  <div class="field">
    <label for="template">Шаблон (используйте {N} как плейсхолдер)</label>
    <input type="text" id="template" value="test\gogo{N}.png" placeholder="test\gogo{N}.png">
    <div class="hint">Например: test\gogo{N}.png, file_{N}.txt, img{N}.jpg</div>
  </div>

  <div class="row">
    <div class="field">
      <label for="from">С какого числа</label>
      <input type="number" id="from" value="0">
    </div>
    <div class="field">
      <label for="to">По какое число</label>
      <input type="number" id="to" value="10">
    </div>
  </div>

  <button id="generate">Сгенерировать</button>

  <div class="output-header">
    <span id="count">Результат</span>
    <button class="copy-btn" id="copy">Копировать</button>
  </div>

  <textarea id="output" spellcheck="false" readonly></textarea>
</div>

<script>
  const $ = id => document.getElementById(id);

  function generate() {
    const template = $('template').value;
    let from = parseInt($('from').value, 10);
    let to = parseInt($('to').value, 10);

    if (isNaN(from)) from = 0;
    if (isNaN(to)) to = 0;

    // Если границы перепутаны — меняем местами
    if (from > to) [from, to] = [to, from];

    const placeholder = /\{N\}/g;
    const lines = [];

    for (let i = from; i <= to; i++) {
      if (placeholder.test(template)) {
        placeholder.lastIndex = 0; // сброс regex
        lines.push(template.replace(/\{N\}/g, i));
      } else {
        // Если плейсхолдера нет — просто добавляем число в конец
        lines.push(template + i);
      }
    }

    $('output').value = lines.join('\n');
    $('count').textContent = `Результат: ${lines.length} строк`;
  }

  $('generate').addEventListener('click', generate);

  // Генерация по Enter в полях
  ['template', 'from', 'to'].forEach(id => {
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });
  });

  // Копирование результата
  $('copy').addEventListener('click', async () => {
    const output = $('output');
    if (!output.value) return;

    try {
      await navigator.clipboard.writeText(output.value);
      const btn = $('copy');
      const original = btn.textContent;
      btn.textContent = 'Скопировано!';
      setTimeout(() => btn.textContent = original, 1500);
    } catch (err) {
      output.select();
      document.execCommand('copy');
    }
  });

  // Автогенерация при загрузке
  generate();
</script>
</body>
</html>

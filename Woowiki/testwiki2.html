	`
	// ----------------------------------------------------------------------
	class Cyber{

		/// Раскрывает текст страницы: блок <<< ... >>> становится исходником и живым результатом, § это обратная кавычка, ¤ это доллар.
		static Expand(Text){
			try{
				const Blocks = Text.replace(/^<<<\n([\s\S]*?)\n>>>$/gm, function(Whole, Source){
					return `::::::code lang=md\n${Source}\n::::::\n\n${Source}`;
				});
				return Blocks.replace(/§/g, function(){ return "`"; }).replace(/¤/g, function(){ return "$"; });
			}catch(e){
				throw new ExceptionWW(`Cyber.Expand: не удалось раскрыть текст страницы, длина = ${Text.length}!`, e);
			}
		}

		static GetBody(Ctx){
			if(Ctx.Body === undefined || Ctx.Body === null){ return ""; }
			return Ctx.Body;
		}

		static ReadText(Props, Ctx){
			const Body = Cyber.GetBody(Ctx);
			if(Body !== ""){ return Body; }
			if(Props.List.length > 0){ return Props.List[0]; }
			return "";
		}

		static FormatSize(Count){
			if(Count < 1024){ return `${Count} B`; }
			return `${(Count / 1024).toFixed(1)} K`;
		}

		/// Полоска из блоков: Value из Max, всего Cells клеток.
		static BarHtml(Value, Max, Cells){
			const Full = Math.round(Math.min(1, Math.max(0, Value / Max)) * Cells);
			return `<span class="cy-bar-fill">${"█".repeat(Full)}</span><span class="cy-bar-rest">${"░".repeat(Cells - Full)}</span>`;
		}

		// ----------------------------------------------------------------------

		/// Возвращает Render для элемента-лога: [ INFO ] Заголовок и текст под ним.
		static MakeLogRender(Kind, Label){
			return function(Props, Ctx){
				try{
					const Title = Props.Title !== undefined ? Props.Title : "";
					const Head  = Title === "" ? `[ ${Label} ]` : `[ ${Label} ] ${Woowiki.Esc(Title)}`;
					return `<div class="cy-log cy-${Kind}"><div class="cy-log-head">${Head}</div><div class="cy-log-body">${Ctx.Md(Cyber.ReadText(Props, Ctx))}</div></div>`;
				}catch(e){
					throw new ExceptionWW(`Cyber.MakeLogRender: элемент ${Kind} упал, Props = ${Woowiki.Dump(Props)}!`, e);
				}
			}
		}

		static RenderQuote(Props, Ctx){
			try{
				const Parts = [];
				if(Props.Author !== undefined){ Parts.push(Woowiki.Esc(Props.Author)); }
				if(Props.Source !== undefined){ Parts.push(`<cite>${Woowiki.Esc(Props.Source)}</cite>`); }
				const Foot = Parts.length === 0 ? "" : `<footer>// ${Parts.join(", ")}</footer>`;
				return `<blockquote class="cy-quote">${Ctx.Md(Cyber.ReadText(Props, Ctx))}${Foot}</blockquote>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderQuote: quote упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderBadge(Props, Ctx){
			try{
				const Text = Props.List.length > 0 ? Props.List[0] : "";
				let ClassName = "cy-tag";
				let Style     = "";
				let Icon      = "";
				if(Props.Color !== undefined){
					if(CY_BADGE_COLORS.indexOf(Props.Color) !== -1){
						ClassName = `cy-tag cy-c-${Props.Color}`;
					}else if(CSS.supports("color", Props.Color)){
						Style = ` style="--cy-c:${Woowiki.Esc(Props.Color)}"`;
					}else{
						throw new ExceptionWW(`Цвет ${Woowiki.Dump(Props.Color)} не понятен, ждём имя из списка или любой CSS-цвет!`, null);
					}
				}
				if(Props.Icon !== undefined){
					const Symbol = CY_ICONS[Props.Icon] !== undefined ? CY_ICONS[Props.Icon] : Props.Icon;
					Icon = `<span class="cy-tag-icon">${Woowiki.Esc(Symbol)}</span>`;
				}
				return `<span class="${ClassName}"${Style}>${Icon}${Woowiki.Esc(Text)}</span>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderBadge: badge упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderProgress(Props, Ctx){
			try{
				let Raw = Props.Value;
				if(Raw === undefined){ Raw = Props.List.length > 0 ? Props.List[0] : ""; }
				let Label = Props.Label;
				if(Label === undefined){ Label = Props.List.length > 1 ? Props.List[1] : ""; }
				const Max   = Props.Max !== undefined ? Number(Props.Max) : 100;
				const Value = Number(Raw);
				if(Raw === ""){ throw new ExceptionWW("Не задано значение, ждём {{progress 70 \"Подпись\"}}!", null); }
				if(Number.isNaN(Value)){ throw new ExceptionWW(`Значение ${Woowiki.Dump(Raw)} не число!`, null); }
				if(!(Max > 0)){ throw new ExceptionWW(`Max = ${Woowiki.Dump(Props.Max)}, ждём число больше нуля!`, null); }
				const Percent = Math.round(Math.min(1, Math.max(0, Value / Max)) * 100);
				const Name    = Label === "" ? "" : `<span class="cy-bar-label">${Woowiki.Esc(Label)}</span> `;
				return `<span class="cy-bar">${Name}[${Cyber.BarHtml(Percent, 100, CY_BAR_CELLS)}] ${Percent}%</span>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderProgress: progress упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderChart(Props, Ctx){
			try{
				const Lines = Cyber.GetBody(Ctx).split("\n");
				const Rows  = [];
				let Longest = 0;
				let Top     = 0;
				for(let i = 0; i < Lines.length; i++){
					const Line = Lines[i].trim();
					if(Line === ""){ continue; }
					const Cut = Line.lastIndexOf(":");
					if(Cut === -1){ throw new ExceptionWW(`В строке ${i + 1} нет двоеточия: ${Woowiki.Dump(Line)}, ждём «метка: число»!`, null); }
					const Label = Line.slice(0, Cut).trim();
					const Value = Number(Line.slice(Cut + 1));
					if(Number.isNaN(Value)){ throw new ExceptionWW(`В строке ${i + 1} после двоеточия не число: ${Woowiki.Dump(Line)}!`, null); }
					Rows.push({ Label: Label, Value: Value });
					Longest = Math.max(Longest, Label.length);
					Top     = Math.max(Top, Value);
				}
				if(Rows.length === 0){ throw new ExceptionWW("Диаграмма пустая, нужна хотя бы одна строка «метка: число»!", null); }
				const Max  = Props.Max !== undefined ? Number(Props.Max) : Top;
				const Unit = Props.Unit !== undefined ? Props.Unit : "";
				if(!(Max > 0)){ throw new ExceptionWW(`Максимум ${Woowiki.Dump(Max)}, ждём число больше нуля!`, null); }

				const Out = [];
				for(let i = 0; i < Rows.length; i++){
					const Row = Rows[i];
					Out.push(`${Woowiki.Esc(Row.Label.padEnd(Longest))} │${Cyber.BarHtml(Row.Value, Max, CY_CHART_CELLS)}│ ${Row.Value}${Woowiki.Esc(Unit)}`);
				}
				return `<pre class="cy-chart">${Out.join("\n")}</pre>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderChart: chart упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderInfobox(Props, Ctx){
			try{
				const Lines = Cyber.GetBody(Ctx).split("\n");
				const Rows  = [];
				for(let i = 0; i < Lines.length; i++){
					const Line = Lines[i].trim();
					if(Line === ""){ continue; }
					const Cut = Line.indexOf("|");
					if(Cut === -1){
						Rows.push(`<tr><td align="left" colspan="2">${Ctx.Inline(Line)}</td></tr>`);
						continue;
					}
					Rows.push(`<tr><th align="left">${Woowiki.Esc(Line.slice(0, Cut).trim())}</th><td align="left">${Ctx.Inline(Line.slice(Cut + 1).trim())}</td></tr>`);
				}
				const Caption = Props.Title !== undefined ? `<caption>${Woowiki.Esc(Props.Title)}</caption>` : "";
				return `<table class="cy-spec">${Caption}${Rows.join("")}</table>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderInfobox: infobox упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderWindow(Props, Ctx){
			try{
				const Title = Props.Title !== undefined ? Props.Title : "window";
				return `<div class="cy-win"><div class="cy-win-bar"><span>${Woowiki.Esc(Title)}</span><span>[_][□][x]</span></div><div class="cy-win-body">${Ctx.Md(Cyber.ReadText(Props, Ctx))}</div></div>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderWindow: window упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderTerminal(Props, Ctx){
			try{
				const Lines = Cyber.GetBody(Ctx).split("\n");
				const Rows  = [];
				for(let i = 0; i < Lines.length; i++){
					const Line = Lines[i].trimEnd();
					if(Line.trim() === ""){ continue; }
					if(Line.startsWith("$ ")){
						Rows.push(`<div class="cy-term-line cy-cmd"><span class="cy-ps">$</span><span class="cy-t">${Woowiki.Esc(Line.slice(2))}</span></div>`);
					}else{
						Rows.push(`<div class="cy-term-line"><span class="cy-t">${Woowiki.Esc(Line)}</span></div>`);
					}
				}
				const Title = Props.Title !== undefined ? Props.Title : "terminal";
				return `<div class="cy-term"><div class="cy-term-bar"><i></i><i></i><i></i><span>${Woowiki.Esc(Title)}</span></div><div class="cy-term-body">${Rows.join("")}</div></div>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderTerminal: terminal упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderAscii(Props, Ctx){
			try{
				return `<pre class="cy-ascii">${Woowiki.Esc(Cyber.GetBody(Ctx))}</pre>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderAscii: ascii упал, Props = ${Woowiki.Dump(Props)}!`, e);
			}
		}

		static RenderMention(Match){
			try{
				const Name = Woowiki.Esc(Match[1]);
				return `<span class="cy-mention" data-cy-user="${Name}">@${Name}</span>`;
			}catch(e){
				throw new ExceptionWW(`Cyber.RenderMention: упоминание упало, Match = ${Woowiki.Dump(Match)}!`, e);
			}
		}

		// ----------------------------------------------------------------------

		static PlayTerminal(Term){
			const Lines = Term.querySelectorAll(".cy-term-line");
			const Texts = [];
			for(let i = 0; i < Lines.length; i++){
				const Span = Lines[i].querySelector(".cy-t");
				Texts.push(Span.textContent);
				Span.textContent = "";
				Lines[i].classList.add("cy-hidden");
			}
			let Line = 0;
			let Char = 0;
			const Step = function(){
				if(!Term.isConnected){ return; }
				if(Line >= Lines.length){ return; }
				const Row  = Lines[Line];
				const Span = Row.querySelector(".cy-t");
				Row.classList.remove("cy-hidden");
				if(!Row.classList.contains("cy-cmd")){
					Span.textContent = Texts[Line];
					Line++;
					setTimeout(Step, 140);
					return;
				}
				Char++;
				Span.textContent = Texts[Line].slice(0, Char);
				if(Char >= Texts[Line].length){
					Line++;
					Char = 0;
					setTimeout(Step, 320);
					return;
				}
				setTimeout(Step, 35);
			}
			Step();
		}

		static Upgrade(Target){
			const Terms = Target.querySelectorAll(".cy-term:not([data-cy-played])");
			for(let i = 0; i < Terms.length; i++){
				if(!Terms[i].isConnected){ continue; }
				Terms[i].dataset.cyPlayed = "1";
				Cyber.PlayTerminal(Terms[i]);
			}
		}

		static DrawBrand(Wiki, Id){
			const Path = Id === Wiki.Options.Start ? "~" : `~/${Id}`;
			Wiki.Dom.Brand.innerHTML = `<span class="cy-b-user">woowz</span>@wiki:<span class="cy-b-path">${Woowiki.Esc(Path)}</span>$<span class="cy-cursor"></span>`;
		}

		static StartHud(Wiki, Hud){
			const Begin = Date.now();
			const Tick = function(){
				const Seconds = Math.floor((Date.now() - Begin) / 1000);
				Hud.textContent = `up ${Seconds}s | ${new Date().toLocaleTimeString("ru-RU")} | ${Wiki.Theme}`;
			}
			Tick();
			setInterval(Tick, 1000);
		}

		static Boot(Wiki){
			try{
				if(sessionStorage.getItem("cy-booted") !== null){ return; }
				sessionStorage.setItem("cy-booted", "1");
			}catch(e){
				return;
			}
			const Box = Woowiki.Make("div", "cy-boot", Wiki.Root);
			let Done  = false;
			let Index = 0;
			let Timer = 0;
			const Finish = function(){
				if(Done){ return; }
				Done = true;
				clearInterval(Timer);
				document.removeEventListener("keydown", Finish);
				Box.classList.add("cy-boot-out");
				setTimeout(function(){ Box.remove(); }, 450);
			}
			Timer = setInterval(function(){
				if(Index >= CY_BOOT_LINES.length){
					clearInterval(Timer);
					setTimeout(Finish, 700);
					return;
				}
				Box.textContent += `${CY_BOOT_LINES[Index]}\n`;
				Index++;
			}, 140);
			Box.addEventListener("click", Finish);
			document.addEventListener("keydown", Finish);
		}

		static BuildTree(Wiki){
			const Groups = Object.create(null);
			const Ids    = Wiki.SortedIds();
			for(let i = 0; i < Ids.length; i++){
				const Page  = Wiki.Pages[Ids[i]];
				const Group = Page.Tags.length > 0 ? Page.Tags[0] : "untagged";
				if(Groups[Group] === undefined){ Groups[Group] = []; }
				Groups[Group].push(Ids[i]);
			}
			const Names = Object.keys(Groups).sort();
			const Lines = [ "~/" ];
			for(let g = 0; g < Names.length; g++){
				const IsLastGroup = g === Names.length - 1;
				const Branch      = IsLastGroup ? "    " : "│   ";
				const Items       = Groups[Names[g]];
				Lines.push(`${IsLastGroup ? "└── " : "├── "}${Woowiki.Esc(Names[g])}/`);
				for(let p = 0; p < Items.length; p++){
					const Page = Wiki.Pages[Items[p]];
					const Mark = p === Items.length - 1 ? "└── " : "├── ";
					Lines.push(`${Branch}${Mark}${Wiki.PageLink(Items[p], Page.Title)} <span class="cy-dim">${Cyber.FormatSize(Page.Content.length)}</span>`);
				}
			}
			return Lines.join("\n");
		}

		// ----------------------------------------------------------------------

		static InstallThemes(Wiki){
			try{
				const Names = Object.keys(CY_THEMES);
				for(let i = 0; i < Names.length; i++){
					const Vars = Object.assign({ Font: CY_FONT, Width: "1400px", Radius: "0px" }, CY_THEMES[Names[i]]);
					Wiki.AddTheme(Names[i], Vars);
				}
				if(Wiki.Code !== undefined){
					for(let i = 0; i < Names.length; i++){
						Wiki.Code.Palettes[Names[i]] = CY_PALETTES[Names[i]];
					}
				}
				Wiki.SetTheme(Wiki.Themes[Wiki.Theme] === undefined ? "matrix" : Wiki.Theme);
				Wiki.Root.dataset.cyTheme = Wiki.Theme;
			}catch(e){
				throw new ExceptionWW("Cyber.InstallThemes: не удалось поставить темы!", e);
			}
		}

		static InstallElements(Wiki){
			try{
				const Kinds = Object.keys(CY_KINDS);
				for(let i = 0; i < Kinds.length; i++){
					Wiki.AddElement(Kinds[i], Cyber.MakeLogRender(Kinds[i], CY_KINDS[Kinds[i]]));
				}
				Wiki.AddElement("quote",    Cyber.RenderQuote);
				Wiki.AddElement("badge",    Cyber.RenderBadge);
				Wiki.AddElement("progress", Cyber.RenderProgress);
				Wiki.AddElement("chart",    Cyber.RenderChart);
				Wiki.AddElement("infobox",  Cyber.RenderInfobox);
				Wiki.AddElement("window",   Cyber.RenderWindow);
				Wiki.AddElement("terminal", Cyber.RenderTerminal);
				Wiki.AddElement("ascii",    Cyber.RenderAscii);
				Wiki.AddInline(/(?<![\w@])@([a-z][a-z0-9_]{1,20})\b/g, Cyber.RenderMention);
				delete Wiki.Elements.vimeo;
				delete Wiki.Elements.map;
			}catch(e){
				throw new ExceptionWW("Cyber.InstallElements: не удалось поставить элементы!", e);
			}
		}

		static InstallChrome(Wiki){
			try{
				Wiki.Root.classList.add("cy");
				Woowiki.Make("div", "cy-scan", Wiki.Root);
				const Hud = Woowiki.Make("div", "cy-hud", Wiki.Root);
				let Started = false;

				Wiki.On("PageAfter", function(Data){
					Data.Article.dataset.cyName = Wiki.Pages[Data.Id] !== undefined ? `${Data.Id}.md` : Data.Id;
					Cyber.DrawBrand(Wiki, Data.Id);
					Cyber.Upgrade(Data.Article);
					if(Started){ return; }
					Started = true;
					Wiki.Root.classList.toggle("cy-crt", Wiki.__StorageGet("cy-crt") !== "0");
					Cyber.StartHud(Wiki, Hud);
					Cyber.Boot(Wiki);
				});
				Wiki.On("Render", function(Data){
					Cyber.Upgrade(Data.Target);
				});
				Wiki.On("Theme", function(Data){

				});

				Wiki.AddButton({ Id: "palette", Order: 90, Label: "◐ палитра", Title: "Следующая палитра", OnClick: function(Wiki){
					const Names = Object.keys(CY_THEMES);
					let Next = 0;
					for(let i = 0; i < Names.length; i++){
						if(Names[i] === Wiki.Theme){ Next = (i + 1) % Names.length; }
					}
					Wiki.SetTheme(Names[Next]);
				}});
				Wiki.AddButton({ Id: "crt", Order: 91, Label: "CRT", Title: "Линии и виньетка", OnClick: function(Wiki){
					const IsOn = !Wiki.Root.classList.contains("cy-crt");
					Wiki.Root.classList.toggle("cy-crt", IsOn);
					Wiki.__StorageSet("cy-crt", IsOn ? "1" : "0");
				}});

				Wiki.AddPanel({ Id: "files", Title: "~/pages", Order: 10, Render: function(Wiki){
					const Ids  = Wiki.SortedIds();
					const Rows = [];
					for(let i = 0; i < Ids.length; i++){
						Rows.push(`<li>${Wiki.PageLink(Ids[i], Wiki.Pages[Ids[i]].Title)}</li>`);
					}
					return `<ul class="cy-ls">${Rows.join("")}</ul>`;

				Wiki.AddPanel({ Id: "sys", Title: "system", Order: 40, Render: function(Wiki){
					return `<ul class="cy-ls"><li>pages: ${Wiki.SortedIds().length}</li><li>theme: ${Woowiki.Esc(Wiki.Theme)}</li><li><a href="${Woowiki.Href("special:tree")}">tree</a></li><li><a href="${Woowiki.Href("special:all")}">ls -a</a></li></ul>`;
				}});
			}catch(e){
				throw new ExceptionWW("Cyber.InstallChrome: не удалось поставить каркас!", e);
			}
		}

		static InstallSpecials(Wiki){
			try{

						return Box;

					}
				});
			}catch(e){
				throw new ExceptionWW("Cyber.InstallSpecials: не удалось поставить спецстраницы!", e);
			}
		}

		static InstallPopups(Wiki){
			try{
				if(Wiki.Popups === undefined){ return; }
				Wiki.Popups.Add("[data-cy-user]", function(Anchor, Wiki){
					const Name = Anchor.dataset.cyUser;
					const User = CY_USERS[Name];
					if(User === undefined){ return `<b>@${Woowiki.Esc(Name)}</b><br><span class="cy-dim">нет такого пользователя</span>`; }

				});

				throw new ExceptionWW("Cyber.InstallPopups: не удалось поставить окна!", e);
			}
		}

		static Install(Wiki){
			try{
				Cyber.InstallThemes(Wiki);

				Cyber.InstallChrome(Wiki);
				Cyber.InstallSpecials(Wiki);
				Cyber.InstallPopups(Wiki);

				throw new ExceptionWW("Cyber.Install: мод cyber не установился!", e);

		}
	}

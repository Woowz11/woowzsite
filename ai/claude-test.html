<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLITCH_REALITY.exe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Courier New', monospace; }
  canvas { display:block; }

  #overlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none; z-index:10; padding-top:30px;
  }

  .glitch{
    position:relative; color:#0ff; font-size:3em; letter-spacing:6px;
    text-transform:uppercase; animation:flicker 2.3s infinite;
    text-shadow:0 0 10px #0ff;
  }
  .glitch::before, .glitch::after{
    content: attr(data-text);
    position:absolute; top:0; left:0; width:100%; height:100%;
  }
  .glitch::before{
    color:#f0f; left:3px; text-shadow:-2px 0 red;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    animation: glitchTop 2.5s infinite linear alternate-reverse;
  }
  .glitch::after{
    color:#ff0; left:-3px; text-shadow:2px 0 blue;
    clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
    animation: glitchBottom 3.1s infinite linear alternate-reverse;
  }
  @keyframes flicker{
    0%,19%,21%,23%,55%,57%,100%{ opacity:1; }
    20%,22%,56%{ opacity:0.4; }
  }
  @keyframes glitchTop{
    0%{ transform:translate(0,0); } 20%{ transform:translate(-5px,-2px); }
    40%{ transform:translate(5px,2px); } 60%{ transform:translate(-3px,1px); }
    80%{ transform:translate(3px,-1px); } 100%{ transform:translate(0,0); }
  }
  @keyframes glitchBottom{
    0%{ transform:translate(0,0); } 20%{ transform:translate(4px,2px); }
    40%{ transform:translate(-4px,-2px); } 60%{ transform:translate(2px,-1px); }
    80%{ transform:translate(-2px,1px); } 100%{ transform:translate(0,0); }
  }

  #msg{
    margin-top:20px; color:#fff; font-size:1.1em; opacity:0.85;
    text-shadow:0 0 6px #0ff, 2px 0 1px red, -2px 0 1px blue;
    letter-spacing:2px; min-height:1.5em; text-align:center; padding:0 10px;
  }

  #chaosBtn{
    margin-top:40px; pointer-events:auto; cursor:pointer;
    background:#111; color:#0f0; border:2px solid #0f0;
    padding:12px 24px; font-family:inherit; font-size:1em;
    text-transform:uppercase; letter-spacing:2px;
    box-shadow:0 0 10px #0f0; transition:all 0.15s;
  }
  #chaosBtn:hover{
    background:#0f0; color:#000; transform:skew(-5deg) scale(1.05);
    box-shadow:0 0 25px #0f0, 0 0 50px #f0f;
  }

  #hint{
    position:fixed; bottom:15px; width:100%; text-align:center;
    color:#555; font-size:0.8em; letter-spacing:1px; z-index:10;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="overlay">
  <h1 class="glitch" data-text="SYSTEM.GLITCH">SYSTEM.GLITCH</h1>
  <div id="msg"></div>
  <button id="chaosBtn">🔴 НЕ НАЖИМАТЬ</button>
</div>

<div id="hint">кликай по сцене • двигай мышкой • не нажимай красную кнопку</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,65);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const pLight1 = new THREE.PointLight(0xff00ff, 2.5, 300);
pLight1.position.set(40,40,40);
scene.add(pLight1);
const pLight2 = new THREE.PointLight(0x00ffff, 2.5, 300);
pLight2.position.set(-40,-30,30);
scene.add(pLight2);

function wobbleMaterial(color){
  return new THREE.ShaderMaterial({
    uniforms:{
      uTime:{ value:0 },
      uColor:{ value:new THREE.Color(color) },
      uGlitch:{ value:0 }
    },
    vertexShader:`
      uniform float uTime;
      uniform float uGlitch;
      varying vec3 vNormal;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        vUv = uv;
        vNormal = normal;
        vec3 pos = position;
        float n = sin(pos.x*0.3+uTime*2.0) + cos(pos.y*0.3+uTime*1.7) + sin(pos.z*0.3+uTime*2.3);
        pos += normal * n * (0.6 + uGlitch*3.0);
        if(uGlitch > 0.4){
          pos.x += (hash(pos.xy+uTime) - 0.5) * uGlitch * 5.0;
          pos.y += (hash(pos.yz+uTime) - 0.5) * uGlitch * 5.0;
        }
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader:`
      uniform vec3 uColor;
      uniform float uTime;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main(){
        float light = dot(normalize(vNormal), normalize(vec3(0.5,0.5,1.0)))*0.5+0.5;
        vec3 col = uColor * light;
        col += 0.15*vec3(sin(uTime+vUv.x*10.0), cos(uTime+vUv.y*10.0), sin(uTime*1.3));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
}

const knotMat = wobbleMaterial('#ff00aa');
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(10,3,150,20), knotMat);
scene.add(knot);

const icoMat = wobbleMaterial('#00ffee');
icoMat.wireframe = true;
const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(16,1), icoMat);
scene.add(ico);

const cubesGroup = new THREE.Group();
const cubeGeo = new THREE.BoxGeometry(2,2,2);
const cubes = [];
for(let i=0;i<130;i++){
  const mat = new THREE.MeshStandardMaterial({
    color:new THREE.Color(`hsl(${Math.random()*360},100%,60%)`),
    emissive:0x111111
  });
  const cube = new THREE.Mesh(cubeGeo, mat);
  const r = 26 + Math.random()*22;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.random()*Math.PI;
  cube.position.set(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.sin(phi)*Math.sin(theta),
    r*Math.cos(phi)
  );
  cube.userData.basePos = cube.position.clone();
  cube.userData.speed = Math.random()*2+0.5;
  cubesGroup.add(cube);
  cubes.push(cube);
}
scene.add(cubesGroup);

const starGeo = new THREE.BufferGeometry();
const starCount = 2500;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount*3;i++) starPos[i] = (Math.random()-0.5)*500;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.4 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
const postScene = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat = new THREE.ShaderMaterial({
  uniforms:{
    tDiffuse:{ value: rt.texture },
    uTime:{ value: 0 },
    uGlitch:{ value: 0 },
    uRes:{ value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }
  `,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uGlitch;
    uniform vec2 uRes;
    varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv = vUv;
      float blockY = floor(uv.y * 40.0);
      float shift = (rand(vec2(blockY, floor(uTime*8.0))) - 0.5) * uGlitch * 0.35;
      uv.x += shift;
      float split = 0.003 + uGlitch*0.02;
      float r = texture2D(tDiffuse, uv + vec2(split,0.0)).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, uv - vec2(split,0.0)).b;
      vec3 col = vec3(r,g,b);
      col *= 0.92 + 0.08*sin(uv.y*uRes.y + uTime*10.0);
      float n = (rand(uv*uTime)-0.5)*0.08*uGlitch;
      col += n;
      if(mod(floor(uTime*3.0), 17.0) < 1.0 && uGlitch > 0.3){
        col = 1.0 - col;
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postScene.add(postQuad);

let mouseX = 0, mouseY = 0;
addEventListener('mousemove', e=>{
  mouseX = (e.clientX/innerWidth - 0.5)*2;
  mouseY = (e.clientY/innerHeight - 0.5)*2;
});

let glitchTarget = 0.1;
setInterval(()=>{
  glitchTarget = Math.random() < 0.3 ? Math.random()*1.6 : 0.1;
}, 1200);

canvas.addEventListener('click', ()=>{
  knotMat.uniforms.uColor.value.setHSL(Math.random(),1,0.5);
  icoMat.uniforms.uColor.value.setHSL(Math.random(),1,0.5);
  glitchTarget = 1.8;
});

const messages = [
  "ОШИБКА 404: РЕАЛЬНОСТЬ НЕ НАЙДЕНА",
  "СИСТЕМА ПЕРЕГРУЖЕНА ВЕСЕЛЬЕМ",
  "ВНИМАНИЕ: ПИКСЕЛИ ВЫШЛИ ИЗ-ПОД КОНТРОЛЯ",
  "ЗАГРУЗКА АЛЬТЕРНАТИВНОЙ ВСЕЛЕННОЙ...",
  "beep boop, ты всё ещё тут?",
  "НЕ БОЙСЯ, ЭТО ПРОСТО ГЛИТЧ (наверное)",
  "КООРДИНАТЫ ПОТЕРЯНЫ, ИЩЕМ...",
  "42% РЕАЛЬНОСТИ ПОВРЕЖДЕНО",
  "СОХРАНЕНИЕ... НЕ СОХРАНЕНО... СОХРАНЕНИЕ..."
];
const msgEl = document.getElementById('msg');
let msgIndex = 0;
function nextMessage(){
  msgEl.textContent = messages[msgIndex % messages.length];
  msgIndex++;
}
nextMessage();
setInterval(nextMessage, 3000);

document.getElementById('chaosBtn').addEventListener('click', ()=>{
  glitchTarget = 2.2;
  document.body.style.filter = 'invert(1)';
  setTimeout(()=>{ document.body.style.filter = ''; }, 250);
  setTimeout(()=>{ glitchTarget = 0.1; }, 1600);
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(innerWidth, innerHeight);
  postMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  knotMat.uniforms.uTime.value = t;
  icoMat.uniforms.uTime.value = t;

  const curGlitch = THREE.MathUtils.lerp(postMat.uniforms.uGlitch.value, glitchTarget, 0.08);
  postMat.uniforms.uGlitch.value = curGlitch;
  knotMat.uniforms.uGlitch.value = curGlitch;
  icoMat.uniforms.uGlitch.value = curGlitch;
  postMat.uniforms.uTime.value = t;

  knot.rotation.x = t*0.4 + mouseY;
  knot.rotation.y = t*0.6 + mouseX;

  ico.rotation.x -= 0.02 + curGlitch*0.05;
  ico.rotation.y += 0.03 + curGlitch*0.05;

  cubes.forEach((cube, i)=>{
    cube.rotation.x += 0.02*cube.userData.speed;
    cube.rotation.y += 0.03*cube.userData.speed;
    const base = cube.userData.basePos;
    cube.position.x = base.x + Math.sin(t*cube.userData.speed+i)*curGlitch*10;
    cube.position.y = base.y + Math.cos(t*cube.userData.speed+i)*curGlitch*10;
    cube.position.z = base.z + Math.sin(t*cube.userData.speed*1.3+i)*curGlitch*10;
  });
  cubesGroup.rotation.y = t*0.1;
  stars.rotation.y = t*0.02;

  camera.position.x = Math.sin(t*0.3)*6 + (Math.random()-0.5)*curGlitch*4;
  camera.position.y = Math.cos(t*0.25)*6 + (Math.random()-0.5)*curGlitch*4;
  camera.lookAt(0,0,0);

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCamera);
}
animate();

})();
</script>
</body>
</html>

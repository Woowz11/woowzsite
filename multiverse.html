    html, body{

                linear-gradient(90deg, rgba(100, 100, 100, 0.4) 2px, transparent 2px);
    }

    body.Dragging{
        cursor: grabbing;
    }

    #Scene{
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        will-change: transform;
    }

    .Point{
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 0;
    }

    .Line{
        position: absolute;
        transform-origin: 0 50%;
        z-index: -1;
    }

    .Curve{
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        z-index: -1;
        overflow: visible;
    }

    .Text{
        position: absolute;
        transform: translate(-50%, -50%);
        z-index: 1;
        white-space: nowrap;
    }

    .Point.Action{
        transition: transform 0.2s;
    }

    .Point.Action:hover{
        transform: translate(-50%, -50%) scale(1.5);

        border-radius: 25px;

</style>

    function RandomFromSeed(Seed){
        let Hash = 0;
        if(typeof Seed === "string"){
            for(let i = 0; i < Seed.length; i++){
                Hash = (Hash << 5) - Hash + Seed.charCodeAt(i);
                Hash = Hash & Hash;
            }
        }else{
            Hash = Seed || 0;
        }

        let State = Hash;
        return function(){
            State = State ^ (State << 13);
            State = State ^ (State >> 17);
            State = State ^ (State << 5 );
            return (State >>> 0) / 4294967296;
        }
    }

    function MultiverseCreate(ID, Name, Options = {}){
        const Multiverse = {
            ID: ID,
            Name: Name || ID,
            Color: Options.Color || "white",
            Image: Options.Image || null,
            Actions: [],
            Parent: null,
            Children: [],
            Desc: Options.Desc || "",
            Stats: null,
            Action: null
        };

        MULTIVERSES[ID] = Multiverse;
        return Multiverse;
    }

    function AddSmartActions(Multiverse, Actions){
        for (const ActionData of Actions) {
            const [ActionName, SolutionsData] = ActionData;

            const Random = RandomFromSeed(ActionName)();

            const ActionObject = {
                Name: ActionName,
                Solution: [],
                Random: Random,
                TopBranch: Random > 0.5,
                Parent: Multiverse,
                Stats: null
            };

            for (const S of SolutionsData) {
                const [SolutionName, Target] = S;

                let TargetMultiverse;
                let NestedActions = [];

                if (Array.isArray(Target) && Target[0] && Target[0].ID) {
                    TargetMultiverse = Target[0];
                    NestedActions = Target.slice(1);
                } else {
                    TargetMultiverse = Target;
                }

                const IsSameMultiverse = (TargetMultiverse === Multiverse);

                const SolutionObject = {
                    Name: SolutionName,
                    Multiverse: TargetMultiverse,
                    IsSame: IsSameMultiverse
                };

                ActionObject.Solution.push(SolutionObject);

                if (TargetMultiverse && !IsSameMultiverse) {
                    if (!Multiverse.Children.includes(TargetMultiverse)) {
                        Multiverse.Children.push(TargetMultiverse);
                    }

                    if (TargetMultiverse.Parent === null) {
                        TargetMultiverse.Parent = Multiverse;
                        TargetMultiverse.Action = ActionObject;
                        TargetMultiverse.Solution = SolutionObject;
                    }
                }

                if (NestedActions.length > 0) {
                    AddSmartActions(TargetMultiverse, NestedActions);
                }
            }

            Multiverse.Actions.push(ActionObject);
        }
    }

    function UpdateStats(Multiverse) {
        function CalculateWidth(mv) {
            let width = 1;
            for (let action of mv.Actions) {
                for (let sol of action.Solution) {
                    if (sol.Multiverse && !sol.IsSame) {
                        width += CalculateWidth(sol.Multiverse);
                    }
                }
            }
            mv.TotalWidth = width;
            return width;
        }

        function AssignLanes(mv, baseLane) {
            mv.Stats = { AbsoluteLane: baseLane };

            let currentAvailableLane = baseLane + 1;

            for (let i = mv.Actions.length - 1; i >= 0; i--) {
                let action = mv.Actions[i];
                for (let sol of action.Solution) {
                    if (sol.Multiverse && !sol.IsSame) {
                        AssignLanes(sol.Multiverse, currentAvailableLane);
                        sol.ReservedLane = currentAvailableLane;
                        currentAvailableLane += sol.Multiverse.TotalWidth;
                    }
                }
            }
        }

        CalculateWidth(Multiverse);
        AssignLanes(Multiverse, 0);
    }

    const Scene    = document.getElementById("Scene");
    const Showcase = document.getElementById("Showcase");

    const StepSize = 50;

    let CurrentSelected = null;

    // ----------------------------------------------------------------------

    let __Scale   = 1;
    let __OffsetX = 0;
    let __OffsetY = 0;

    let IsDragging = false;

    let __S_OffsetX, __S_OffsetY, __SO_OffsetX, __SO_OffsetY;

    function UpdateLineThickness(){
        const Points  = document.querySelectorAll(".Point");
        const Lines   = document.querySelectorAll(".Line");
        const Curves  = document.querySelectorAll(".Curve path");
        const Texts   = document.querySelectorAll(".Text");

        for(const Point of Points){
            Point.style.padding = `${Point.W_Radius / __Scale}px`;
        }

        for(const Line of Lines){
            Line.style.height = `${Line.W_Thickness / __Scale}px`;
        }

        for(const Path of Curves){
            Path.setAttribute("stroke-width", Path.W_Thickness / __Scale);
        }

        for(const Text of Texts){
            Text.style.fontSize = `${Text.W_Size / __Scale}em`;
        }
    }

    function UpdateSceneTransform(){
        Scene.style.transform = `translate(${__OffsetX}px, ${__OffsetY}px) scale(${__Scale})`;

        const GridSize = (StepSize * 2) * __Scale;
        document.body.style.backgroundSize = `${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px`;

        const GridX = __OffsetX;
        const GridY = __OffsetY;
        const GridSmall = StepSize * __Scale;
        document.body.style.backgroundPosition = `${GridX}px ${GridY}px, ${GridX}px ${GridY}px, ${GridX - GridSmall}px ${GridY - GridSmall}px, ${GridX - GridSmall}px ${GridY - GridSmall}px`;

        UpdateLineThickness();
    }

    function ResetSceneTransform(){
        __Scale = 1;
        __OffsetX = window.innerWidth  / 2;
        __OffsetY = window.innerHeight / 2;
        UpdateSceneTransform();
    }

    document.addEventListener("mousedown", e => {
        if(e.button !== 0){ return; }

        if(e.target.closest("#Showcase")){
            return;
        }

        IsDragging = true;

        __S_OffsetX  = e.clientX;
        __S_OffsetY  = e.clientY;
        __SO_OffsetX = __OffsetX;
        __SO_OffsetY = __OffsetY;

        document.body.classList.add("Dragging");
    });

    document.addEventListener("mousemove", e => {
        if(!IsDragging){ return; }

        __OffsetX = __SO_OffsetX + (e.clientX - __S_OffsetX);
        __OffsetY = __SO_OffsetY + (e.clientY - __S_OffsetY);

        UpdateSceneTransform();
    });

    document.addEventListener("mouseup", e => {
        if(e.button !== 0){ return; }
        IsDragging = false;

        document.body.classList.remove("Dragging");
    });

    document.addEventListener("wheel", e => {
        e.preventDefault();

        const MouseX = e.clientX;
        const MouseY = e.clientY;

        const WorldX = (MouseX - __OffsetX) / __Scale;
        const WorldY = (MouseY - __OffsetY) / __Scale;

        const Factor = 1 + ((e.deltaY > 0 ? -1 : 1) * 0.08);
        __Scale = Math.min(30, Math.max(0.01, __Scale * Factor));

        __OffsetX = MouseX - WorldX * __Scale;
        __OffsetY = MouseY - WorldY * __Scale;
        UpdateSceneTransform();
    }, { passive: false });

    document.addEventListener("keydown", e => {
       if(e.key === "Home"){
           e.preventDefault();
           ResetSceneTransform();
       }
    });

                Result += `<br>От действия: ${(Multiverse.Action ? Multiverse.Action.Name : "...")}<br>Решения: ${(Multiverse.Solution ? Multiverse.Solution.Name : "...")}`;

                Result += `<br><br>${Multiverse.Desc}`;
            }else{
                const Action = CurrentSelected;

                Result += `<h1>Действие: ${Action.Name}</h1>`;

                for(const Solution of Action.Solution){
                    Result += `<br><text style="color: ${Solution.Multiverse.Color};">${Solution.Name}</text>`;
                }
            }

            Showcase.innerHTML = Result;

            Showcase.style.display = "unset";
        }
    }

    function CreatePoint(X, Y, Radius, Color){
        Radius = Radius || 5;
        Color  = Color  || "white";

        const Element = document.createElement("div");
        Element.className = "Point";

        Element.W_Radius = Radius;

        Element.style.cssText = `left: ${X}px; top: ${Y}px; padding: ${Radius}px; background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateLine(X1, Y1, X2, Y2, Thickness, Color){
        Thickness = Thickness || 2;
        Color     = Color     || "white";

        const Element = document.createElement("div");
        Element.className = "Line";

        Element.W_Thickness = Thickness;

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);
        const Angle = Math.atan2(DY, DX) * (180 / Math.PI);

        Element.style.cssText = `left: ${X1}px; top: ${Y1}px; width: ${L}px; height: ${Thickness}px; transform: rotate(${Angle}deg); background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateCurve(X1, Y1, X2, Y2, Thickness, CurveHeight, Color){
        Thickness   = Thickness   || 2;
        CurveHeight = CurveHeight || StepSize/2;
        Color       = Color       || "white";

        if(X1 === X2 || Y1 === Y2){
            CreateLine(X1, Y1, X2, Y2, Thickness, Color);
            return;
        }

        CurveHeight *= (Y1 > Y2 ? 1 : -1);

        const MX = (X1 + X2) / 2;
        const MY = (Y1 + Y2) / 2;

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);

        const NX = DX / L;
        const NY = DY / L;

        const PX = -NY;
        const PY =  NX;

        const CX1 = X1 + DX * 0.33 + PX * CurveHeight;
        const CY1 = Y1 + DY * 0.33 + PY * CurveHeight;

        const CX2 = X2 - DX * 0.33 - PX * CurveHeight;
        const CY2 = Y2 - DY * 0.33 - PY * CurveHeight;

        const SVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        SVG.setAttribute("class", "Curve");

        const Path = document.createElementNS("http://www.w3.org/2000/svg", "path");

        Path.W_Thickness = Thickness;

        const D = `M ${X1} ${Y1} C ${CX1} ${CY1}, ${CX2} ${CY2}, ${X2} ${Y2}`;

        Path.setAttribute("d", D);
        Path.setAttribute("fill", "none");
        Path.setAttribute("stroke", Color);
        Path.setAttribute("stroke-width", Thickness);
        Path.setAttribute("stroke-linecap", "round");
        Path.setAttribute("stroke-linejoin", "round");

        SVG.appendChild(Path);
        Scene.appendChild(SVG);
        return SVG;
    }

    function CreateText(X, Y, Text, Size, Color){
        Text  = Text  || "Новый текст!";
        Size  = Size  || 1;
        Color = Color || "black";

        const Element = document.createElement("div");
        Element.className = "Text";

        Element.W_Size = Size;

        Element.textContent = Text;

        Element.style.cssText = `left: ${X}px; top: ${Y}px; font-size: ${Size}em; color: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    // ----------------------------------------------------------------------

    function GenerateMultiverses(){
        const MaxLength = 1000000;
        const LineThickness = 8;
        const PointRadius = 10;

        function GenerateAction(Action, X, Y){
            console.group(`Действие: ${Action.Name}`)

            //CreateText(X, Y - StepSize / 2, Action.Name, 1, "white");
            const Point = CreatePoint(X, Y, PointRadius);
            Point.classList.add("Action");

            Point.addEventListener("mouseenter", e => {
                Select(Action);
            });

            for(const Solution of Action.Solution){
                if(Solution.IsSame){ continue }

                const X2 = X + StepSize * 5;
                const Y2 = StepSize * Solution.Multiverse.Stats.AbsoluteLane;

                const Curve = CreateLine(X, Y, X2, Y2, LineThickness, Solution.Multiverse.Color);//CreateCurve(X, Y, X2, Y2, LineThickness, 5 * Math.sqrt((X2 - X)^2 + (Y2 - Y)^2), Solution.Multiverse.Color);
                Curve.addEventListener("mouseenter", e => {
                   Select(Solution.Multiverse);
                });

                GenerateMultiverse(Solution.Multiverse, X2, Y2);
            }

            console.groupEnd();
        }

        function GenerateMultiverse(Multiverse, X, Y, Start = false){
            console.group(`Вселенная: ${Multiverse.Name}`)

            if(Start){
                const Line = CreateLine(X - MaxLength, Y, X, Y, LineThickness, Multiverse.Color);
                Line.addEventListener("mouseenter", e => {
                    Select(Multiverse);
                });
            }

            function GenerateLine(X2, I){
                const Action = Multiverse.Actions[I];
                if(Action){
                    const NextX = X2 + StepSize;

                    GenerateAction(Action, NextX, Y);

                    const Line = CreateLine(X2, Y, NextX, Y, LineThickness, Multiverse.Color);
                    Line.addEventListener("mouseenter", e => {
                        Select(Multiverse);
                    });

                    GenerateLine(NextX, I + 1);
                }else{
                    const Line = CreateLine(X2, Y, X2 + MaxLength, Y, LineThickness, Multiverse.Color);
                    Line.addEventListener("mouseenter", e => {
                        Select(Multiverse);
                    });
                }
            }
            GenerateLine(X, 0);

            console.groupEnd();
        }
        GenerateMultiverse(M_Real, 0, 0, true);
    }
    GenerateMultiverses();

    // ----------------------------------------------------------------------

    ResetSceneTransform();
    Select(null);
</script>

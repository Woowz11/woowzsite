<!DOCTYPE HTML>
<html lang="ru">
    <meta charset="UTF-8">
    <title>Мультивлесенные</title>

<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background-color: #2a2a2a;
        background-image:
                linear-gradient(rgba(60, 60, 60, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 60, 60, 0.8) 1px, transparent 1px),
                linear-gradient(rgba(100, 100, 100, 0.6) 2px, transparent 2px),
                linear-gradient(90deg, rgba(100, 100, 100, 0.6) 2px, transparent 2px);
    }

    body.Dragging{
        cursor: grabbing;
    }
    
    #Scene{
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        will-change: transform;
    }

    .Point{
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 0;
    }

    .Line{
        position: absolute;
        transform-origin: 0 0;
        z-index: -1;
    }

    .Curve{
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        z-index: -1;
        overflow: visible;
    }

</style>

<body>
    <div id="Scene"></div>
</body>

<script>
    const MULTIVERSES = {

    };

    // ----------------------------------------------------------------------

    const Scene = document.getElementById("Scene");

    const StepSize = 50;

    // ----------------------------------------------------------------------

    let __Scale   = 1;
    let __OffsetX = 0;
    let __OffsetY = 0;

    let IsDragging = false;

    let __S_OffsetX, __S_OffsetY, __SO_OffsetX, __SO_OffsetY;

    function UpdateSceneTransform(){
        Scene.style.transform = `translate(${__OffsetX}px, ${__OffsetY}px) scale(${__Scale})`;

        const GridSize = (StepSize * 2) * __Scale;
        document.body.style.backgroundSize = `${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px`;

        const GridX = __OffsetX;
        const GridY = __OffsetY;
        const GridSmall = StepSize * __Scale;
        document.body.style.backgroundPosition = `${GridX}px ${GridY}px, ${GridX}px ${GridY}px, ${GridX - GridSmall}px ${GridY - GridSmall}px, ${GridX - GridSmall}px ${GridY - GridSmall}px`;
    }

    function ResetSceneTransform(){
        __Scale = 1;
        __OffsetX = window.innerWidth  / 2;
        __OffsetY = window.innerHeight / 2;
        UpdateSceneTransform();
    }
    ResetSceneTransform();

    document.addEventListener("mousedown", e => {
        if(e.button !== 0){ return; }

        IsDragging = true;

        __S_OffsetX  = e.clientX;
        __S_OffsetY  = e.clientY;
        __SO_OffsetX = __OffsetX;
        __SO_OffsetY = __OffsetY;
        
        document.body.classList.add("Dragging");
    });

    document.addEventListener("mousemove", e => {
        if(!IsDragging){ return; }

        __OffsetX = __SO_OffsetX + (e.clientX - __S_OffsetX);
        __OffsetY = __SO_OffsetY + (e.clientY - __S_OffsetY);

        UpdateSceneTransform();
    });

    document.addEventListener("mouseup", e => {
        if(e.button !== 0){ return; }
        IsDragging = false;

        document.body.classList.remove("Dragging");
    });

    document.addEventListener("wheel", e => {
        e.preventDefault();

        const MouseX = e.clientX;
        const MouseY = e.clientY;

        const WorldX = (MouseX - __OffsetX) / __Scale;
        const WorldY = (MouseY - __OffsetY) / __Scale;

        const Factor = 1 + ((e.deltaY > 0 ? -1 : 1) * 0.08);
        __Scale = Math.min(20, Math.max(0.1, __Scale * Factor));

        __OffsetX = MouseX - WorldX * __Scale;
        __OffsetY = MouseY - WorldY * __Scale;
        UpdateSceneTransform();
    }, { passive: false });

    document.addEventListener("keydown", e => {
       if(e.key === "Home"){
           e.preventDefault();
           ResetSceneTransform();
       }
    });

    // ----------------------------------------------------------------------

    function CreatePoint(X, Y, Radius, Color){
        Radius = Radius || 5;
        Color  = Color  || "white";

        const Element = document.createElement("div");
        Element.className = "Point";

        Element.style.cssText = `left: ${X}px; top: ${Y}px; padding: ${Radius}px; background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateLine(X1, Y1, X2, Y2, Thickness, Color){
        Thickness = Thickness || 2;
        Color     = Color     || "white";

        const Element = document.createElement("div");
        Element.className = "Line";

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);
        const Angle = Math.atan2(DY, DX) * (180 / Math.PI);

        const NX = DX / L;
        const NY = DY / L;

        const OffsetX = -(Thickness / 2) * -NY;
        const OffsetY = -(Thickness / 2) *  NX;

        Element.style.cssText = `left: ${X1 + OffsetX}px; top: ${Y1 + OffsetY}px; width: ${L}px; height: ${Thickness}px; transform: rotate(${Angle}deg); background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateCurve(X1, Y1, X2, Y2, Thickness, CurveHeight, Color){
        Thickness   = Thickness   || 2;
        CurveHeight = CurveHeight || 50;
        Color       = Color       || "white";

        if(X1 === X2 || Y1 === Y2){
            CreateLine(X1, Y1, X2, Y2, Thickness);
            return;
        }

        const MX = (X1 + X2) / 2;
        const MY = (Y1 + Y2) / 2;

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);

        const NX = DX / L;
        const NY = DY / L;

        const PX = -NY;
        const PY =  NX;

        const CX1 = X1 + DX * 0.33 + PX * CurveHeight;
        const CY1 = Y1 + DY * 0.33 + PY * CurveHeight;

        const CX2 = X2 - DX * 0.33 - PX * CurveHeight;
        const CY2 = Y2 - DY * 0.33 - PY * CurveHeight;

        const SVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        SVG.setAttribute("class", "Curve");

        const Path = document.createElementNS("http://www.w3.org/2000/svg", "path");

        const D = `M ${X1} ${Y1} C ${CX1} ${CY1}, ${CX2} ${CY2}, ${X2} ${Y2}`;

        Path.setAttribute("d", D);
        Path.setAttribute("fill", "none");
        Path.setAttribute("stroke", Color);
        Path.setAttribute("stroke-width", Thickness);
        Path.setAttribute("stroke-linecap", "round");
        Path.setAttribute("stroke-linejoin", "round");

        SVG.appendChild(Path);
        Scene.appendChild(SVG);
        return SVG;
    }

    function GenerateMultiverses(){
        CreatePoint(0, 0);
        CreatePoint(StepSize, 0);
        CreatePoint(0, StepSize);
        CreatePoint(StepSize, StepSize);

        CreateLine(0, 0, 0, StepSize);
        CreateLine(StepSize, 0, 0, 0);

        CreateCurve(0, 0, StepSize, -StepSize * 2);
    }
    GenerateMultiverses();

    // ----------------------------------------------------------------------
</script>

</html>

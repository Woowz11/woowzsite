<!DOCTYPE HTML>
<html lang="ru">
    <meta charset="UTF-8">
    <title>Мультивлесенные</title>

<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background-color: #2a2a2a;
        background-image:
                linear-gradient(rgba(60, 60, 60, 0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 60, 60, 0.6) 1px, transparent 1px),
                linear-gradient(rgba(100, 100, 100, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(100, 100, 100, 0.4) 2px, transparent 2px);
    }

    body.Dragging{
        cursor: grabbing;
    }

    #Scene{
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        will-change: transform;
    }

    .Point{
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 0;
    }

    .Line{
        position: absolute;
        transform-origin: 0 0;
        z-index: -1;
    }

    .Curve{
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        z-index: -1;
        overflow: visible;
    }

    .Text{
        position: absolute;
        transform: translate(-50%, -50%);
        z-index: 1;
        white-space: nowrap;
    }

    .Point.Action{
        transition: transform 0.2s;
    }

    .Point.Action:hover{
        transform: translate(-50%, -50%) scale(1.5);
    }

    #Showcase{
        position: absolute;
        background: rgb(120, 120, 120);
        border-radius: 25px;
        right: 10px;
        top: 10px;
        width: 350px;
        height: 500px;
        display: none;
        padding: 10px;
    }

</style>

<body>
    <div id="Scene"></div>
    <div id="Showcase"></div>
</body>

<script>
    const MULTIVERSES = {
        "name": "Реальный мир",
        "color": "white",
        "actions": [
            {
                "name": "Woowz11 начал изучать программирование",
                "solution": [
                    "Начал изучать",
                    ["Посчитал не нужным", {
                        "name": "Woowz11 не знает программирования",
                        "color": "yellow"
                    }]
                ]
            },
            {
                "name": "Woowz11 познакомился с Wldoui",
                "solution": [
                    "Познакомился",
                    ["Не пересекались", {
                        "name": "Woowz11 не знает Wldoui",
                        "color": "rgb(200, 255, 200)"
                    }],
                    ["Не понравились друг другу с первого взгляда", {
                        "name": "Wldoui враг №1",
                        "color": "rgb(0, 0, 255)"
                    }]
                ]
            },
            {
                "name": "Создание GOLU",
                "solution": [
                    "Создать, но как вымышленного персонажа",
                    ["Создать, как настоящего AI", {
                        "name": "Реальный GOLU",
                        "color": "rgb(255, 200, 200)",
                        "actions": [
                            {
                                "name": "Разработка GOLU",
                                "solution": [
                                    "GOLU ожил как искуственный интелект!",
                                    ["GOLU был создан случайно, из-за бага", {
                                        "name": "GOLU обрёл случайное сознание",
                                        "color": "rgb(255, 150, 150)",
                                        "actions": [
                                            {
                                                "name": "GOLU обрёл не контролируемое самосознание",
                                                "solution": [
                                                    "GOLU обрёл не контролируемое самосознание",
                                                    ["GOLU не обрёл контролируемое созание", {
                                                        "name": "GOLU остановился в развии",
                                                        "color": "rgb(255, 150, 255)"
                                                    }]
                                                ]
                                            }
                                        ]
                                    }],
                                    ["GOLU был заброшен как проект", {
                                        "name": "GOLU неудачный проект",
                                        "color": "rgb(200, 200, 200)"
                                    }]
                                ]
                            },
                            {
                                "name": "Полностью помешаться на GOLU",
                                "solution": [
                                    "GOLU просто существует",
                                    ["Woowz11 полностью помешался на развитии GOLU", {
                                        "name": "Woowz11 помешан на создании GOLU",
                                        "color": "rgb(255, 200, 150)"
                                    }]
                                ]
                            }
                        ]
                    }],
                    ["Забыть как страшный сон", {
                        "name": "GOLU запрещён",
                        "color": "rgb(200, 200, 255)"
                    }],
                    ["Посчитать это безумным", {
                        "name": "GOLU для изгоев!",
                        "color": "rgb(255, 255, 200)"
                    }]
                ]
            }
        ]
    };

    let MULTIVERSES_CACHED = {};

    function ScanTree(Node, AddHere){
        AddHere["name"] = Node["name"] || "UNKNOWN NAME";
        AddHere["color"] = Node["color"] || "white";
        AddHere["image"] = Node["image"] || null;

        AddHere["actions"] = [];
        if(AddHere["actions"]){
            for(const Action of Node["actions"]){
                let NewAction = {};

                NewAction["parent"] = AddHere;
                NewAction["name"] = Action["name"] || "UNKNOWN NAME";

                NewAction["branch_top"] = RandomFromSeed(NewAction["name"])() > 0.5;
                NewAction["indent"] = 1;

                NewAction["solution"] = [];
                if(Action["solution"]){
                    for(const Solution of Action["solution"]) {
                        let NewSolution = {};

                        if(typeof Solution === "string"){
                            NewSolution["name"] = Solution;
                            NewSolution["action"] = NewAction;
                        }else{
                            NewSolution["name"] = Solution[0];
                            NewSolution["multiverse"] = Solution[1];
                            ScanTree(Solution[1], NewSolution["multiverse"]);
                            NewSolution["multiverse"]["action"] = NewAction;

                            NewSolution["action"] = NewAction;
                        }

                        NewAction["solution"].push(NewSolution);
                    }
                }

                AddHere["actions"].push(NewAction);
            }
        }
    }
    ScanTree(MULTIVERSES, MULTIVERSES_CACHED);

    console.log(MULTIVERSES_CACHED);

    // ----------------------------------------------------------------------

    const Scene    = document.getElementById("Scene");
    const Showcase = document.getElementById("Showcase");

    const StepSize = 50;

    let CurrentSelected = null;

    // ----------------------------------------------------------------------

    function RandomFromSeed(Seed){
        let Hash = 0;
        if(typeof Seed === "string"){
            for(let i = 0; i < Seed.length; i++){
                Hash = (Hash << 5) - Hash + Seed.charCodeAt(i);
                Hash = Hash & Hash;
            }
        }else{
            Hash = Seed || 0;
        }

        let State = Hash;
        return function(){
            State = State ^ (State << 13);
            State = State ^ (State >> 17);
            State = State ^ (State << 5 );
            return (State >>> 0) / 4294967296;
        }
    }

    // ----------------------------------------------------------------------

    let __Scale   = 1;
    let __OffsetX = 0;
    let __OffsetY = 0;

    let IsDragging = false;

    let __S_OffsetX, __S_OffsetY, __SO_OffsetX, __SO_OffsetY;

    function UpdateLineThickness(){
        const Points  = document.querySelectorAll(".Point");
        const Lines   = document.querySelectorAll(".Line");
        const Curves  = document.querySelectorAll(".Curve path");
        const Texts   = document.querySelectorAll(".Text");

        for(const Point of Points){
            Point.style.padding = `${Point.W_Radius / __Scale}px`;
        }

        for(const Line of Lines){
            Line.style.height = `${Line.W_Thickness / __Scale}px`;
        }

        for(const Path of Curves){
            Path.setAttribute("stroke-width", Path.W_Thickness / __Scale);
        }

        for(const Text of Texts){
            Text.style.fontSize = `${Text.W_Size / __Scale}em`;
        }
    }

    function UpdateSceneTransform(){
        Scene.style.transform = `translate(${__OffsetX}px, ${__OffsetY}px) scale(${__Scale})`;

        const GridSize = (StepSize * 2) * __Scale;
        document.body.style.backgroundSize = `${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px, ${GridSize}px ${GridSize}px`;

        const GridX = __OffsetX;
        const GridY = __OffsetY;
        const GridSmall = StepSize * __Scale;
        document.body.style.backgroundPosition = `${GridX}px ${GridY}px, ${GridX}px ${GridY}px, ${GridX - GridSmall}px ${GridY - GridSmall}px, ${GridX - GridSmall}px ${GridY - GridSmall}px`;

        UpdateLineThickness();
    }

    function ResetSceneTransform(){
        __Scale = 1;
        __OffsetX = window.innerWidth  / 2;
        __OffsetY = window.innerHeight / 2;
        UpdateSceneTransform();
    }

    document.addEventListener("mousedown", e => {
        if(e.button !== 0){ return; }

        if(e.target.closest("#Showcase")){
            return;
        }

        IsDragging = true;

        __S_OffsetX  = e.clientX;
        __S_OffsetY  = e.clientY;
        __SO_OffsetX = __OffsetX;
        __SO_OffsetY = __OffsetY;

        document.body.classList.add("Dragging");
    });

    document.addEventListener("mousemove", e => {
        if(!IsDragging){ return; }

        __OffsetX = __SO_OffsetX + (e.clientX - __S_OffsetX);
        __OffsetY = __SO_OffsetY + (e.clientY - __S_OffsetY);

        UpdateSceneTransform();
    });

    document.addEventListener("mouseup", e => {
        if(e.button !== 0){ return; }
        IsDragging = false;

        document.body.classList.remove("Dragging");
    });

    document.addEventListener("wheel", e => {
        e.preventDefault();

        const MouseX = e.clientX;
        const MouseY = e.clientY;

        const WorldX = (MouseX - __OffsetX) / __Scale;
        const WorldY = (MouseY - __OffsetY) / __Scale;

        const Factor = 1 + ((e.deltaY > 0 ? -1 : 1) * 0.08);
        __Scale = Math.min(30, Math.max(0.01, __Scale * Factor));

        __OffsetX = MouseX - WorldX * __Scale;
        __OffsetY = MouseY - WorldY * __Scale;
        UpdateSceneTransform();
    }, { passive: false });

    document.addEventListener("keydown", e => {
       if(e.key === "Home"){
           e.preventDefault();
           ResetSceneTransform();
       }
    });

    // ----------------------------------------------------------------------

    function Select(Object){
        CurrentSelected = Object;

        if(Object === null){
            Showcase.style.display = "none";
        }else{
            let Result = "";

            if(CurrentSelected["solution"]){
                const Name      = CurrentSelected["name"] || "GOVNO";
                const Solutions = CurrentSelected["solution"] || [];

                Result += `<h1>Действие: ${Name}</h1>`;

                for(const Solution of Solutions){
                    if(typeof Solution === "string"){
                        Result += `<br><text style="color: black;">${Solution}</text>`;
                    }else{
                        const SName = Solution[0] || "GOVNO2";
                        const Multiverse = Solution[1];

                        const SColor = Multiverse["color"] || "white";

                        Result += `<br><text style="color: ${SColor};">${SName}</text>`;
                    }
                }
            }else{
                const Name    = CurrentSelected["name"] || "GOVNO";
                const Color   = CurrentSelected["color"] || "white";
                const Image   = CurrentSelected["image"] || null;
                const Actions = CurrentSelected["actions"] || [];

                Result += `<h1 style="color: ${Color};">${Name}</h1>`;
            }

            Showcase.innerHTML = Result;

            Showcase.style.display = "unset";
        }
    }

    // ----------------------------------------------------------------------

    function CreatePoint(X, Y, Radius, Color){
        Radius = Radius || 5;
        Color  = Color  || "white";

        const Element = document.createElement("div");
        Element.className = "Point";

        Element.W_Radius = Radius;

        Element.style.cssText = `left: ${X}px; top: ${Y}px; padding: ${Radius}px; background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateLine(X1, Y1, X2, Y2, Thickness, Color){
        Thickness = Thickness || 2;
        Color     = Color     || "white";

        const Element = document.createElement("div");
        Element.className = "Line";

        Element.W_Thickness = Thickness;

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);
        const Angle = Math.atan2(DY, DX) * (180 / Math.PI);

        Element.style.cssText = `left: ${X1}px; top: ${Y1}px; width: ${L}px; height: ${Thickness}px; transform: rotate(${Angle}deg); background: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    function CreateCurve(X1, Y1, X2, Y2, Thickness, CurveHeight, Color){
        Thickness   = Thickness   || 2;
        CurveHeight = CurveHeight || StepSize/2;
        Color       = Color       || "white";

        if(X1 === X2 || Y1 === Y2){
            CreateLine(X1, Y1, X2, Y2, Thickness);
            return;
        }

        CurveHeight *= (Y1 > Y2 ? 1 : -1);

        const MX = (X1 + X2) / 2;
        const MY = (Y1 + Y2) / 2;

        const DX = X2 - X1;
        const DY = Y2 - Y1;
        const L = Math.sqrt(DX*DX + DY*DY);

        const NX = DX / L;
        const NY = DY / L;

        const PX = -NY;
        const PY =  NX;

        const CX1 = X1 + DX * 0.33 + PX * CurveHeight;
        const CY1 = Y1 + DY * 0.33 + PY * CurveHeight;

        const CX2 = X2 - DX * 0.33 - PX * CurveHeight;
        const CY2 = Y2 - DY * 0.33 - PY * CurveHeight;

        const SVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        SVG.setAttribute("class", "Curve");

        const Path = document.createElementNS("http://www.w3.org/2000/svg", "path");

        Path.W_Thickness = Thickness;

        const D = `M ${X1} ${Y1} C ${CX1} ${CY1}, ${CX2} ${CY2}, ${X2} ${Y2}`;

        Path.setAttribute("d", D);
        Path.setAttribute("fill", "none");
        Path.setAttribute("stroke", Color);
        Path.setAttribute("stroke-width", Thickness);
        Path.setAttribute("stroke-linecap", "round");
        Path.setAttribute("stroke-linejoin", "round");

        SVG.appendChild(Path);
        Scene.appendChild(SVG);
        return SVG;
    }

    function CreateText(X, Y, Text, Size, Color){
        Text  = Text  || "Новый текст!";
        Size  = Size  || 1;
        Color = Color || "black";

        const Element = document.createElement("div");
        Element.className = "Text";

        Element.W_Size = Size;

        Element.textContent = Text;

        Element.style.cssText = `left: ${X}px; top: ${Y}px; font-size: ${Size}em; color: ${Color};`;
        Scene.appendChild(Element);
        return Element;
    }

    // ----------------------------------------------------------------------

    function GenerateMultiverses(){
        function GenerateSolutuion(Solution, X1, Y1, X2, Y2, D){
            if(typeof Solution === "string"){
                console.log(`Настоящее решение: ${Solution}`);
                return;
            }

            const Name       = Solution[0];
            const Multiverse = Solution[1];

            console.group(`Решение: ${Name}`);

            const Element = CreateCurve(X1, Y1, X2, Y2, 4, StepSize * D, Multiverse["color"] || "white");

            Element.addEventListener("mouseenter", e => {
                Select(Multiverse);
            });

            GenerateMultiverse(Multiverse, X2, Y2, D);

            console.groupEnd();
        }

        function GenerateAction(Action, X, Y, D){
            const Name = Action["name"] || "Без имени действие!";
            const Solutions = Action["solution"] || [];

            console.group(`Действие: ${Name}`);

            const Element = CreatePoint(X, Y, 10);
            Element.classList.add("Action");

            Element.addEventListener("mouseenter", e => {
                Select(Action);
            });

            CreateText(X, Y - StepSize, Name, undefined, "white");

            const InvertEvent = RandomFromSeed(Name)() > 0.5;

            let i = 0;
            let Even = InvertEvent;

            for(const Solution of Solutions){
                GenerateSolutuion(Solution, X, Y, X + StepSize * D, Y + (i * StepSize) * (Even ? 1 : -1) * D, D / 2);
                if(Even){
                    if(InvertEvent){ i += 1; }
                    Even = false;
                }else{
                    if(!InvertEvent){ i += 1; }
                    Even = true;
                }
            }

            console.groupEnd();
        }

        function GenerateMultiverse(Multiverse, X, Y, D){
            const Name = Multiverse["name"] || "Без имени вселенная!";
            const Color = Multiverse["color"] || "white";
            const Actions = Multiverse["actions"] || [];
            const Base = Multiverse === MULTIVERSES;

            console.group(`Создание вселенной: ${Name}`)

            const Element = CreateLine(X, Y, X + 100000, Y, 4, Color);
            Element.addEventListener("mouseenter", e => {
                Select(Multiverse);
            });

            if(Base){
                const Element2 = CreateLine(X - 100000, Y, X, Y, 4, Color);
                Element2.addEventListener("mouseenter", e => {
                    Select(Multiverse);
                });
            }

            let i = 0;
            for(const Action of Actions){
                i += 2;
                GenerateAction(Action, X + (Base ? i - 2 : i) * StepSize * D, Y, D / (i / 2));
            }

            console.groupEnd();
        }

        GenerateMultiverse(MULTIVERSES, 0, 0, 20);
    }
    GenerateMultiverses();

    // ----------------------------------------------------------------------

    ResetSceneTransform();
    Select(null);
</script>

</html>
